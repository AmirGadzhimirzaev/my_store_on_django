{% extends 'catalog/base.html' %}
{% block content %}
<article class="blog-post m-4">
    <p class="blog-post-meta">{{ blog.created_at }}</p>
    <p>{{ blog.content }}</p>
</article>
<div class="btn-group m-4">
    <a class="btn btn-secondary" href="{% url 'blog:blog_list' %}" role="button">Назад</a>
</div>
{% endblock %}
