[tool.poetry]
name = "my-store-on-django"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "^6.0"
python-dotenv = "^1.2.1"
psycopg2-binary = "^2.9.11"
psycopg2 = "^2.9.11"
pillow = "^12.0.0"
ipython = "^9.8.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.19.0"
black = "^25.12.0"
isort = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = "venv"

[tool.black]
line-length = 119
exclude = '''
(
    /(
        \.eggs
      | \.git
      | \.hg
      | \.mypy_cache
      | \.tox
      | \.venv
      | dist
    )/
    | foo.py
)
'''

[tool.isort]
line_length = 119
